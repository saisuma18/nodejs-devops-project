apiVersion: apps/v1
kind: Deployment

metadata:
  name: nodejs-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nodejs-demo

  template:
    metadata:
      labels:
        app: nodejs-demo

    spec:
      containers:
        - name: nodejs-demo
          image: nodejs-devops-demo:1.0

          imagePullPolicy: Never

          ports:
            - containerPort: 3000

          env:
            - name: NODE_ENV
              value: "production"

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
